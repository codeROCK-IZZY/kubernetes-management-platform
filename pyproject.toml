[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kubernetes-management-platform"
version = "1.0.0"
description = "Kubernetes fleet management: admission policies on parsed manifests with verified fixes, rightsizing judged on the weeks after, upgrade blockers, and Claude patches checked by the policy engine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pyyaml>=6", "anthropic>=2.0", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27", "types-PyYAML"]

[project.scripts]
kubefleet = "kubefleet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "PT"]
ignore = ["E501", "PLR0913", "PLR2004", "PLR0911", "PLR0912", "PLR0915", "PLC0415", "PLR0917", "RUF001", "PLW2901", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018"]
"src/kubefleet/report.py" = ["E501"]
"src/kubefleet/app.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
